[package]
name = "jobrog"
version = "2.0.0"
authors = ["dfhoughton <dfhoughton@gmail.com>"]
description = "command line job clock"
homepage = "https://github.com/dfhoughton/jobrog"
repository = "https://github.com/dfhoughton/jobrog"
readme = "README.md"
keywords = ["work", "log", "time", "notes"]
categories = ["command-line-utilities"]
license = "GPL-2.0"
edition = "2021"
rust-version = "1.85"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "job"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
larry = "0.4"
regex = "1"
flate2 = "1"
rust-ini = "0.21"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
colonnade = { version = "2", features = ["nbsp"] }
terminal_size = "0.4"
nu-ansi-term = "0.50"
serde_json = "1"
two_timer = { version = "3", features = ["small_grammar"] }

[dev-dependencies]
rand = "0.9"
